# The one environment for both GUIs (Linux / WSL, x86-64).
#
#   conda env create -f environment.yml
#   conda activate mtinv
#   python tests/test_install.py        # optional: check the install
#   mtinv                               # inversion setup GUI
#   mtplot                              # model plotting GUI
#   gateway_mt                          # MT data and project GUI
#   mt_launcher                         # a window that starts the three above
#   jupyter lab notebooks               # the step-by-step notebooks
#
# Every conda package is pinned to the exact build that was tested, which keeps
# the solve to seconds (an open solve takes many minutes) and installs the same
# thing on every machine.
#
# deal.II must stay at 9.3.x: GoFEM installations built against it can't read
# meshes from newer versions.  It sets the rest of the stack: Python 3.10 is the
# newest its conda-forge builds support, and boost / hdf5 / netCDF / GDAL / VTK
# are held to versions compatible with it.  Replacing a pin here means repeating
# the mesh comparisons, because the .tria files must stay readable by GoFEM.
#
# The direct dependencies are python, dealii, numpy, scipy, matplotlib-base,
# pandas, pyproj, shapely, rasterio, geopandas, pyogrio, xarray, netcdf4,
# pyvista, pyvistaqt, pyqt, cmcrameri, requests, pyyaml and jupyterlab; the rest
# come with them.
